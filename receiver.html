<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioBridge Receiver</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #101010;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 24px;
    }

    .server {
        color: #aaa;
        margin-bottom: 20px;
        word-break: break-all;
    }

    .status {
        padding: 12px;
        background: #181818;
        border: 1px solid #333;
        margin-bottom: 15px;
    }

    .online {
        color: #00e676;
    }

    .offline {
        color: #ff5252;
    }

    button {
        padding: 12px 18px;
        margin-right: 8px;
        border: 0;
        cursor: pointer;
        font-weight: bold;
    }

    #connectBtn {
        background: #1976d2;
        color: white;
    }

    #audioBtn {
        background: #00a152;
        color: white;
    }

    #stopBtn {
        background: #c62828;
        color: white;
    }

    .stats {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .card {
        background: #181818;
        border: 1px solid #333;
        padding: 15px;
    }

    .value {
        font-size: 22px;
        font-weight: bold;
        margin-top: 5px;
    }

    #log {
        margin-top: 20px;
        height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        background: #080808;
        border: 1px solid #333;
        padding: 12px;
        font-family: Consolas, monospace;
        font-size: 12px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>AUDIOBRIDGE RECEIVER</h1>

    <div class="server">
        Server:
        <span id="serverText"></span>
    </div>

    <div class="status">
        Status:
        <strong id="status" class="offline">
            OFFLINE
        </strong>
    </div>

    <button id="connectBtn">
        CONNECT
    </button>

    <button id="audioBtn">
        ENABLE AUDIO
    </button>

    <button id="stopBtn">
        STOP AUDIO
    </button>

    <div class="stats">
        <div class="card">
            Packets
            <div class="value" id="packetCount">0</div>
        </div>

        <div class="card">
            Bytes
            <div class="value" id="byteCount">0</div>
        </div>

        <div class="card">
            Audio
            <div class="value" id="audioStatus">OFF</div>
        </div>
    </div>

    <div id="log"></div>

</div>

<script>
const SERVER_URL =
    "wss://transmitter-zctz.onrender.com/audio";

const SAMPLE_RATE = 48000;
const CHANNELS = 2;
const BYTES_PER_SAMPLE = 2;

let socket = null;
let audioContext = null;
let audioEnabled = false;

let nextAudioTime = 0;

let packetCount = 0;
let byteCount = 0;

const serverText =
    document.getElementById("serverText");

const status =
    document.getElementById("status");

const packetCountElement =
    document.getElementById("packetCount");

const byteCountElement =
    document.getElementById("byteCount");

const audioStatus =
    document.getElementById("audioStatus");

const logElement =
    document.getElementById("log");

serverText.textContent = SERVER_URL;

function log(message) {
    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;
}

function setStatus(text, online) {
    status.textContent = text;

    status.className =
        online ? "online" : "offline";
}

async function enableAudio() {
    try {
        if (!audioContext) {
            audioContext =
                new AudioContext({
                    sampleRate: SAMPLE_RATE
                });
        }

        await audioContext.resume();

        audioEnabled = true;

        audioStatus.textContent = "ON";

        log(
            `Audio enabled at ${audioContext.sampleRate} Hz`
        );

        if (
            nextAudioTime <
            audioContext.currentTime
        ) {
            nextAudioTime =
                audioContext.currentTime + 0.05;
        }

    } catch (error) {
        log(
            `Audio enable error: ${error.message}`
        );
    }
}

function stopAudio() {
    audioEnabled = false;

    nextAudioTime = 0;

    audioStatus.textContent = "OFF";

    log("Audio playback disabled.");
}

function connect() {
    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    log(
        `Connecting to ${SERVER_URL}...`
    );

    setStatus("CONNECTING...", false);

    socket = new WebSocket(SERVER_URL);

    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
        setStatus("ONLINE", true);

        log("WebSocket connected.");

        socket.send(
            JSON.stringify({
                type: "register-receiver"
            })
        );

        log("Receiver registration sent.");
    };

    socket.onmessage = async (event) => {

        if (typeof event.data === "string") {
            handleTextMessage(event.data);
            return;
        }

        if (event.data instanceof Blob) {
            const buffer =
                await event.data.arrayBuffer();

            handleAudioPacket(buffer);
            return;
        }

        if (event.data instanceof ArrayBuffer) {
            handleAudioPacket(event.data);
        }
    };

    socket.onerror = () => {
        log("WebSocket error.");
    };

    socket.onclose = (event) => {
        setStatus("OFFLINE", false);

        log(
            `WebSocket closed. code=${event.code}`
        );

        socket = null;
    };
}

function handleTextMessage(text) {
    try {
        const message =
            JSON.parse(text);

        if (
            message.type === "status" ||
            message.type === "server-status"
        ) {
            log(
                `Server: ${
                    message.message ||
                    message.status ||
                    "online"
                }`
            );

            return;
        }

        if (message.type === "pong") {
            return;
        }

        log(
            `Server message: ${text}`
        );

    } catch {
        log(
            `Server text: ${text}`
        );
    }
}

function handleAudioPacket(arrayBuffer) {
    packetCount++;
    byteCount += arrayBuffer.byteLength;

    packetCountElement.textContent =
        packetCount.toLocaleString();

    byteCountElement.textContent =
        byteCount.toLocaleString();

    if (!audioEnabled) {
        return;
    }

    playPcm16Stereo(arrayBuffer);
}

function playPcm16Stereo(arrayBuffer) {
    if (!audioContext) {
        return;
    }

    const int16 =
        new Int16Array(arrayBuffer);

    const frameCount =
        Math.floor(
            int16.length / CHANNELS
        );

    if (frameCount <= 0) {
        return;
    }

    const buffer =
        audioContext.createBuffer(
            CHANNELS,
            frameCount,
            SAMPLE_RATE
        );

    const left =
        buffer.getChannelData(0);

    const right =
        buffer.getChannelData(1);

    for (let i = 0; i < frameCount; i++) {
        left[i] =
            int16[i * 2] / 32768;

        right[i] =
            int16[i * 2 + 1] / 32768;
    }

    const source =
        audioContext.createBufferSource();

    source.buffer = buffer;

    source.connect(
        audioContext.destination
    );

    const duration =
        frameCount / SAMPLE_RATE;

    const now =
        audioContext.currentTime;

    if (
        nextAudioTime <
        now + 0.02
    ) {
        nextAudioTime =
            now + 0.05;
    }

    source.start(nextAudioTime);

    nextAudioTime += duration;
}

document
    .getElementById("connectBtn")
    .addEventListener(
        "click",
        connect
    );

document
    .getElementById("audioBtn")
    .addEventListener(
        "click",
        enableAudio
    );

document
    .getElementById("stopBtn")
    .addEventListener(
        "click",
        stopAudio
    );

log("AudioBridge receiver ready.");
log(
    `Format: ${SAMPLE_RATE} Hz / ` +
    `${CHANNELS} channels / PCM 16-bit`
);
</script>

</body>
</html>
