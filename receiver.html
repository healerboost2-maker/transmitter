<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AudioBridge Receiver</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #111827;
        color: #f9fafb;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
    }

    h1 {
        margin: 0 0 18px;
        font-size: 25px;
        letter-spacing: 1px;
    }

    .panel {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 15px;
    }

    .label {
        color: #9ca3af;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .value {
        font-size: 17px;
        font-weight: bold;
        overflow-wrap: anywhere;
    }

    .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 5px;
        background: #374151;
        color: #f9fafb;
        font-weight: bold;
    }

    .status.connected {
        background: #065f46;
        color: #a7f3d0;
    }

    .status.error {
        background: #7f1d1d;
        color: #fecaca;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .stat {
        background: #111827;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 12px;
    }

    .stat-value {
        font-size: 24px;
        font-weight: bold;
        margin-top: 5px;
    }

    button {
        border: 0;
        border-radius: 6px;
        padding: 11px 16px;
        margin-right: 8px;
        margin-bottom: 8px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    button.stop {
        background: #b91c1c;
    }

    button.stop:hover {
        background: #991b1b;
    }

    pre {
        margin: 0;
        min-height: 150px;
        max-height: 260px;
        overflow-y: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #030712;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 12px;
        color: #d1d5db;
        font-family: Consolas, monospace;
        font-size: 12px;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>
<div class="container">

    <h1>AUDIOBRIDGE RECEIVER</h1>

    <div class="panel">
        <div class="label">Server</div>
        <div class="value">
            wss://transmitter-zctz.onrender.com/audio
        </div>
    </div>

    <div class="panel">
        <div class="label">Connection Status</div>
        <div id="connectionStatus" class="status">
            DISCONNECTED
        </div>

        <p id="serverStatus">
            Server status: Unknown
        </p>

        <button id="connectButton">
            CONNECT
        </button>

        <button id="disconnectButton" class="stop">
            DISCONNECT
        </button>

        <button id="audioButton">
            ENABLE AUDIO
        </button>
    </div>

    <div class="panel">
        <div class="grid">

            <div class="stat">
                <div class="label">Packets Received</div>
                <div id="packetCount" class="stat-value">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="label">Bytes Received</div>
                <div id="byteCount" class="stat-value">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="label">Audio Status</div>
                <div id="audioStatus" class="stat-value">
                    OFF
                </div>
            </div>

        </div>
    </div>

    <div class="panel">
        <div class="label">Event Log</div>
        <pre id="logBox"></pre>
    </div>

</div>

<script>
"use strict";

const SERVER_URL =
    "wss://transmitter-zctz.onrender.com/audio";

const SAMPLE_RATE = 48000;
const CHANNELS = 2;
const BYTES_PER_SAMPLE = 2;

let socket = null;
let audioContext = null;
let audioEnabled = false;

let packetCount = 0;
let byteCount = 0;

let audioQueue = [];
let nextAudioTime = 0;

const connectionStatus =
    document.getElementById("connectionStatus");

const serverStatus =
    document.getElementById("serverStatus");

const packetCountElement =
    document.getElementById("packetCount");

const byteCountElement =
    document.getElementById("byteCount");

const audioStatus =
    document.getElementById("audioStatus");

const logBox =
    document.getElementById("logBox");

const connectButton =
    document.getElementById("connectButton");

const disconnectButton =
    document.getElementById("disconnectButton");

const audioButton =
    document.getElementById("audioButton");


function log(message) {
    const timestamp = new Date().toLocaleTimeString();

    logBox.textContent +=
        `[${timestamp}] ${message}\n`;

    logBox.scrollTop = logBox.scrollHeight;
}


function setConnectionStatus(text, type) {
    connectionStatus.textContent = text;

    connectionStatus.className = "status";

    if (type === "connected") {
        connectionStatus.classList.add("connected");
    }

    if (type === "error") {
        connectionStatus.classList.add("error");
    }
}


function updateCounters() {
    packetCountElement.textContent =
        packetCount.toLocaleString();

    byteCountElement.textContent =
        byteCount.toLocaleString();
}


async function enableAudio() {
    try {
        if (!audioContext) {
            audioContext = new AudioContext({
                sampleRate: SAMPLE_RATE
            });
        }

        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        audioEnabled = true;
        audioStatus.textContent = "ON";
        audioButton.textContent = "AUDIO ENABLED";

        log("Audio playback enabled.");
    } catch (error) {
        log(
            "Audio enable error: " + error.message
        );
    }
}


function connect() {
    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        log("Already connected or connecting.");
        return;
    }

    log(
        "Connecting to " + SERVER_URL + "..."
    );

    setConnectionStatus(
        "CONNECTING",
        ""
    );

    socket = new WebSocket(SERVER_URL);

    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
        setConnectionStatus(
            "CONNECTED",
            "connected"
        );

        log("WebSocket connection established.");

        socket.send(
            JSON.stringify({
                type: "register-receiver"
            })
        );

        log("Receiver registration sent.");
    };

    socket.onmessage = async (event) => {
        if (typeof event.data === "string") {
            handleTextMessage(event.data);
            return;
        }

        if (event.data instanceof ArrayBuffer) {
            handleAudioPacket(event.data);
            return;
        }

        if (event.data instanceof Blob) {
            const arrayBuffer =
                await event.data.arrayBuffer();

            handleAudioPacket(arrayBuffer);
        }
    };

    socket.onerror = () => {
        setConnectionStatus(
            "ERROR",
            "error"
        );

        log("WebSocket error occurred.");
    };

    socket.onclose = () => {
        setConnectionStatus(
            "DISCONNECTED",
            ""
        );

        log("WebSocket connection closed.");
    };
}


function handleTextMessage(text) {
    log("Server: " + text);

    let message;

    try {
        message = JSON.parse(text);
    } catch (error) {
        return;
    }

    if (message.message || message.status) {
        serverStatus.textContent =
            "Server status: " +
            (
                message.message ||
                message.status ||
                "Unknown"
            );
    }
}


function handleAudioPacket(arrayBuffer) {
    packetCount++;
    byteCount += arrayBuffer.byteLength;

    updateCounters();

    if (audioEnabled) {
        playPcm16Stereo(arrayBuffer);
    }
}


function playPcm16Stereo(arrayBuffer) {
    if (!audioContext) {
        return;
    }

    const input =
        new Int16Array(arrayBuffer);

    const frameCount =
        Math.floor(input.length / CHANNELS);

    if (frameCount <= 0) {
        return;
    }

    const audioBuffer =
        audioContext.createBuffer(
            CHANNELS,
            frameCount,
            SAMPLE_RATE
        );

    const leftChannel =
        audioBuffer.getChannelData(0);

    const rightChannel =
        audioBuffer.getChannelData(1);

    for (let index = 0; index < frameCount; index++) {
        const left =
            input[index * 2] / 32768;

        const right =
            input[index * 2 + 1] / 32768;

        leftChannel[index] = left;
        rightChannel[index] = right;
    }

    const source =
        audioContext.createBufferSource();

    source.buffer = audioBuffer;
    source.connect(audioContext.destination);

    const currentTime =
        audioContext.currentTime;

    if (nextAudioTime < currentTime) {
        nextAudioTime = currentTime + 0.03;
    }

    source.start(nextAudioTime);

    nextAudioTime += audioBuffer.duration;
}


function disconnect() {
    if (socket) {
        socket.close();
        socket = null;
    }

    setConnectionStatus(
        "DISCONNECTED",
        ""
    );

    log("Disconnected.");
}


connectButton.addEventListener(
    "click",
    connect
);

disconnectButton.addEventListener(
    "click",
    disconnect
);

audioButton.addEventListener(
    "click",
    enableAudio
);

log("AudioBridge receiver ready.");
log("Server: " + SERVER_URL);
</script>

</body>
</html>
