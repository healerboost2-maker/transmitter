<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioBridge Receiver</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101418;
            color: #e8edf2;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 560px;
            background: #1b2229;
            border: 1px solid #39444e;
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 25px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #9eabb6;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .settings {
            margin-bottom: 18px;
            border: 1px solid #39444e;
            border-radius: 8px;
            background: #141a20;
            overflow: hidden;
        }

        .settings summary {
            padding: 13px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #cbd5df;
            user-select: none;
        }

        .settings-content {
            padding: 14px;
            border-top: 1px solid #39444e;
        }

        .settings-label {
            display: block;
            color: #9eabb6;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .server-input-row {
            display: flex;
            gap: 8px;
        }

        #serverUrlInput {
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #46535e;
            border-radius: 6px;
            background: #080b0e;
            color: #ffffff;
            font-size: 13px;
        }

        #saveServerButton {
            background: #475569;
            white-space: nowrap;
        }

        .status-box {
            background: #11171c;
            border: 1px solid #303b44;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 18px;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 9px;
            font-size: 14px;
        }

        .status-line:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #9eabb6;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        .online {
            color: #4ade80;
        }

        .offline {
            color: #ff6b6b;
        }

        .warning {
            color: #facc15;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
            margin-bottom: 22px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 13px 7px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #connectButton {
            background: #2563eb;
        }

        #playButton {
            background: #16a34a;
        }

        #pauseButton {
            background: #ca8a04;
        }

        #disconnectButton {
            background: #dc2626;
        }

        .meter-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #9eabb6;
        }

        .db-value {
            color: #4ade80;
            font-weight: bold;
        }

        .meter {
            height: 28px;
            background: #080b0e;
            border: 1px solid #303b44;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            gap: 2px;
            padding: 4px;
        }

        .meter-bar {
            flex: 1;
            background: #26313a;
            border-radius: 2px;
        }

        .meter-bar.green {
            background: #22c55e;
        }

        .meter-bar.yellow {
            background: #eab308;
        }

        .meter-bar.red {
            background: #ef4444;
        }

        .scale {
            display: flex;
            justify-content: space-between;
            color: #6f7d88;
            font-size: 10px;
            margin-top: 5px;
        }

        .log {
            margin-top: 20px;
            background: #080b0e;
            border: 1px solid #303b44;
            border-radius: 7px;
            padding: 12px;
            height: 135px;
            overflow-y: auto;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #b8c4ce;
            white-space: pre-wrap;
        }

        @media (max-width: 500px) {
            .buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            .server-input-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="panel">
        <h1>AUDIOBRIDGE RECEIVER</h1>
        <div class="subtitle">Live audio receiver and monitor</div>

        <details class="settings">
            <summary>⚙ SETTINGS — SERVER CONFIGURATION</summary>

            <div class="settings-content">
                <label class="settings-label" for="serverUrlInput">
                    AudioBridge WebSocket Server URL
                </label>

                <div class="server-input-row">
                    <input
                        id="serverUrlInput"
                        type="text"
                        placeholder="wss://your-service.onrender.com/audio"
                    >

                    <button id="saveServerButton">
                        SAVE
                    </button>
                </div>
            </div>
        </details>

        <div class="status-box">
            <div class="status-line">
                <span class="label">Server</span>
                <span id="serverStatus" class="value offline">
                    Disconnected
                </span>
            </div>

            <div class="status-line">
                <span class="label">Audio Engine</span>
                <span id="audioStatus" class="value offline">
                    Stopped
                </span>
            </div>

            <div class="status-line">
                <span class="label">Audio Format</span>
                <span class="value">48 kHz / Stereo / PCM</span>
            </div>

            <div class="status-line">
                <span class="label">Received Packets</span>
                <span id="packetCount" class="value">0</span>
            </div>
        </div>

        <div class="buttons">
            <button id="connectButton">CONNECT</button>
            <button id="playButton" disabled>PLAY</button>
            <button id="pauseButton" disabled>PAUSE</button>
            <button id="disconnectButton" disabled>
                DISCONNECT
            </button>
        </div>

        <div class="meter-header">
            <span>RECEIVED AUDIO LEVEL</span>
            <span id="dbValue" class="db-value">-60 dB</span>
        </div>

        <div id="meter" class="meter"></div>

        <div class="scale">
            <span>-60 dB</span>
            <span>-30 dB</span>
            <span>-12 dB</span>
            <span>-3 dB</span>
            <span>0 dB</span>
        </div>

        <div id="log" class="log">Receiver ready.</div>
    </div>

    <script>
        "use strict";

        const SAMPLE_RATE = 48000;
        const CHANNELS = 2;

        const DEFAULT_SERVER_URL =
            "wss://YOUR-RENDER-SERVICE.onrender.com/audio";

        const connectButton =
            document.getElementById("connectButton");

        const playButton =
            document.getElementById("playButton");

        const pauseButton =
            document.getElementById("pauseButton");

        const disconnectButton =
            document.getElementById("disconnectButton");

        const saveServerButton =
            document.getElementById("saveServerButton");

        const serverUrlInput =
            document.getElementById("serverUrlInput");

        const serverStatus =
            document.getElementById("serverStatus");

        const audioStatus =
            document.getElementById("audioStatus");

        const packetCountElement =
            document.getElementById("packetCount");

        const meterElement =
            document.getElementById("meter");

        const dbValue =
            document.getElementById("dbValue");

        const logElement =
            document.getElementById("log");

        let socket = null;
        let audioContext = null;
        let analyser = null;
        let audioStarted = false;
        let nextAudioTime = 0;
        let packetCount = 0;
        let meterBars = [];
        let activeSources = new Set();
        let animationFrame = null;

        function getSavedServerUrl() {
            try {
                return localStorage.getItem("audiobridge_server_url")
                    || DEFAULT_SERVER_URL;
            } catch (error) {
                return DEFAULT_SERVER_URL;
            }
        }

        function saveServerUrl() {
            const url = serverUrlInput.value.trim();

            if (!url) {
                log("Please enter a server URL.");
                return;
            }

            try {
                localStorage.setItem(
                    "audiobridge_server_url",
                    url
                );
            } catch (error) {
                log("Could not save URL in browser storage.");
            }

            log("Server URL saved.");
        }

        function getServerUrl() {
            return serverUrlInput.value.trim();
        }

        function log(message) {
            const time = new Date().toLocaleTimeString();

            logElement.textContent +=
                `\n[${time}] ${message}`;

            logElement.scrollTop = logElement.scrollHeight;
        }

        function setStatus(element, text, className) {
            element.textContent = text;
            element.className = `value ${className}`;
        }

        function createMeter() {
            for (let i = 0; i < 40; i++) {
                const bar = document.createElement("div");

                bar.className = "meter-bar";
                meterElement.appendChild(bar);
                meterBars.push(bar);
            }
        }

        function updateMeter(level, db) {
            const activeBars =
                Math.round(level * meterBars.length);

            meterBars.forEach((bar, index) => {
                bar.className = "meter-bar";

                if (index < activeBars) {
                    if (index >= meterBars.length * 0.90) {
                        bar.classList.add("red");
                    } else if (index >= meterBars.length * 0.70) {
                        bar.classList.add("yellow");
                    } else {
                        bar.classList.add("green");
                    }
                }
            });

            dbValue.textContent = `${db.toFixed(1)} dB`;

            if (db > -3) {
                dbValue.style.color = "#ef4444";
            } else if (db > -12) {
                dbValue.style.color = "#eab308";
            } else {
                dbValue.style.color = "#4ade80";
            }
        }

        function resetMeter() {
            updateMeter(0, -60);
        }

        function startMeterAnimation() {
            if (animationFrame) {
                return;
            }

            function drawMeter() {
                if (!analyser) {
                    resetMeter();
                    animationFrame = null;
                    return;
                }

                const data =
                    new Float32Array(analyser.fftSize);

                analyser.getFloatTimeDomainData(data);

                let sum = 0;

                for (let i = 0; i < data.length; i++) {
                    sum += data[i] * data[i];
                }

                const rms = Math.sqrt(sum / data.length);

                let db = -60;

                if (rms > 0.00001) {
                    db = 20 * Math.log10(rms);
                }

                db = Math.max(-60, Math.min(0, db));

                const level = (db + 60) / 60;

                if (audioStarted) {
                    updateMeter(level, db);
                } else {
                    resetMeter();
                }

                animationFrame =
                    requestAnimationFrame(drawMeter);
            }

            animationFrame =
                requestAnimationFrame(drawMeter);
        }

        function createAudioEngine() {
            if (audioContext) {
                return;
            }

            audioContext = new AudioContext({
                sampleRate: SAMPLE_RATE
            });

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.75;

            analyser.connect(audioContext.destination);

            startMeterAnimation();
        }

        function stopAllSources() {
            for (const source of activeSources) {
                try {
                    source.stop();
                } catch (error) {
                    // Source may have already stopped.
                }
            }

            activeSources.clear();
        }

        function convertPCMToAudioBuffer(arrayBuffer) {
            if (!audioContext) {
                return null;
            }

            const input = new Int16Array(arrayBuffer);

            if (input.length < CHANNELS) {
                return null;
            }

            const frameCount =
                Math.floor(input.length / CHANNELS);

            const audioBuffer =
                audioContext.createBuffer(
                    CHANNELS,
                    frameCount,
                    SAMPLE_RATE
                );

            const leftChannel =
                audioBuffer.getChannelData(0);

            const rightChannel =
                audioBuffer.getChannelData(1);

            for (let frame = 0; frame < frameCount; frame++) {
                leftChannel[frame] =
                    input[frame * 2] / 32768;

                rightChannel[frame] =
                    input[frame * 2 + 1] / 32768;
            }

            return audioBuffer;
        }

        function playPCM(arrayBuffer) {
            if (
                !audioStarted ||
                !audioContext ||
                !analyser
            ) {
                return;
            }

            const audioBuffer =
                convertPCMToAudioBuffer(arrayBuffer);

            if (!audioBuffer) {
                return;
            }

            const source =
                audioContext.createBufferSource();

            source.buffer = audioBuffer;
            source.connect(analyser);

            activeSources.add(source);

            source.onended = () => {
                activeSources.delete(source);
            };

            const currentTime =
                audioContext.currentTime;

            if (nextAudioTime < currentTime + 0.08) {
                nextAudioTime = currentTime + 0.08;
            }

            source.start(nextAudioTime);
            nextAudioTime += audioBuffer.duration;
        }

        async function playAudio() {
            if (
                !socket ||
                socket.readyState !== WebSocket.OPEN
            ) {
                log("Connect to the server first.");
                return;
            }

            createAudioEngine();

            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }

            audioStarted = true;
            nextAudioTime =
                audioContext.currentTime + 0.1;

            setStatus(audioStatus, "Playing", "online");

            playButton.disabled = true;
            pauseButton.disabled = false;

            log("Audio playback started.");
        }

        function pauseAudio() {
            audioStarted = false;
            nextAudioTime = 0;

            stopAllSources();

            if (
                audioContext &&
                audioContext.state === "running"
            ) {
                audioContext.suspend();
            }

            setStatus(audioStatus, "Paused", "warning");

            playButton.disabled = false;
            pauseButton.disabled = true;

            resetMeter();

            log("Audio playback paused.");
        }

        function connectToServer() {
            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {
                log("Already connected.");
                return;
            }

            const serverUrl = getServerUrl();

            if (
                !serverUrl ||
                serverUrl.includes("YOUR-RENDER-SERVICE")
            ) {
                log("Please configure the server URL in SETTINGS.");
                return;
            }

            log(`Connecting to ${serverUrl}...`);

            socket = new WebSocket(serverUrl);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                setStatus(serverStatus, "Connected", "online");

                connectButton.disabled = true;
                playButton.disabled = false;
                disconnectButton.disabled = false;

                log("Connected to AudioBridge server.");

                socket.send(JSON.stringify({
                    type: "register-receiver"
                }));
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    let message;

                    try {
                        message = JSON.parse(event.data);
                    } catch (error) {
                        log("Invalid server message.");
                        return;
                    }

                    if (message.type === "registered") {
                        log("Receiver registered successfully.");
                    }

                    if (message.type === "status") {
                        log(
                            `Transmitter connected: ${
                                message.transmitterConnected
                                    ? "YES"
                                    : "NO"
                            }`
                        );
                    }

                    if (message.type === "error") {
                        log(`Server error: ${message.message}`);
                    }

                    return;
                }

                packetCount++;
                packetCountElement.textContent = packetCount;

                playPCM(event.data);
            };

            socket.onerror = () => {
                log("WebSocket connection error.");
            };

            socket.onclose = () => {
                audioStarted = false;
                stopAllSources();

                setStatus(
                    serverStatus,
                    "Disconnected",
                    "offline"
                );

                setStatus(
                    audioStatus,
                    "Stopped",
                    "offline"
                );

                connectButton.disabled = false;
                playButton.disabled = true;
                pauseButton.disabled = true;
                disconnectButton.disabled = true;

                resetMeter();

                log("Disconnected from server.");
            };
        }

        function disconnectFromServer() {
            if (socket) {
                socket.close();
            }

            socket = null;
            audioStarted = false;

            stopAllSources();

            setStatus(
                serverStatus,
                "Disconnected",
                "offline"
            );

            setStatus(
                audioStatus,
                "Stopped",
                "offline"
            );

            connectButton.disabled = false;
            playButton.disabled = true;
            pauseButton.disabled = true;
            disconnectButton.disabled = true;

            resetMeter();

            log("Disconnected.");
        }

        saveServerButton.addEventListener(
            "click",
            saveServerUrl
        );

        connectButton.addEventListener(
            "click",
            connectToServer
        );

        playButton.addEventListener(
            "click",
            playAudio
        );

        pauseButton.addEventListener(
            "click",
            pauseAudio
        );

        disconnectButton.addEventListener(
            "click",
            disconnectFromServer
        );

        serverUrlInput.value = getSavedServerUrl();

        createMeter();
        resetMeter();
    </script>
</body>
</html>
